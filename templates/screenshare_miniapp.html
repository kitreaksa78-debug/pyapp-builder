<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>មើលអេក្រង់ទូរស័ព្ទ — Telegram</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0b0e14; color: #e6edf3;
      font: 15px/1.6 -apple-system, "Segoe UI", Roboto, "Khmer OS", sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom)); }
    main { max-width: 420px; text-align: center; }
    h1 { font-size: 18px; margin: 0 0 10px; }
    p { color: #8b949e; font-size: 14px; margin: 0 0 10px; }
    a { color: #7ee787; }
    .spin { width: 26px; height: 26px; margin: 0 auto 14px; border-radius: 50%;
      border: 3px solid #21262d; border-top-color: #7ee787; animation: r 0.9s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<main>
  <div class="spin" id="spin"></div>
  <h1>មើលអេក្រង់ទូរស័ព្ទ</h1>
  <p id="msg">កំពុងបើក link…</p>
  <p id="hint" hidden>
    បើក <a id="botlink" href="#" rel="noopener">bot</a> → ចាប់ផ្តើមចែកអេក្រង់ក្នុង app →
    សារមកដល់ទីនេះ ហើយចុចប៊ូតុង «មើលអេក្រង់»។
  </p>
</main>
<script>
(function () {
  var bot = {{ bot | tojson }};
  var tg = (window.Telegram && window.Telegram.WebApp) || null;
  var msg = document.getElementById('msg');
  var hint = document.getElementById('hint');
  var spin = document.getElementById('spin');

  if (tg) {
    try {
      tg.ready();
      tg.expand();
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
      if (tg.setHeaderColor) tg.setHeaderColor('#0b0e14');
    } catch (e) { /* client ចាស់ — មិនខ្វល់ */ }
  }

  function param(name) {
    var m = new RegExp('[?&]' + name + '=([^&#]+)').exec(location.search + '&' + location.hash);
    return m ? decodeURIComponent(m[1]) : '';
  }

  function startParam() {
    var p = '';
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
      p = String(tg.initDataUnsafe.start_param);
    }
    if (!p) p = param('startapp') || param('tgWebAppStartParam') || param('code');
    return String(p || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  }

  var code = startParam();
  if (code.length >= 8) {
    location.replace('/s/' + encodeURIComponent(code));
    return;
  }

  spin.hidden = true;
  msg.textContent = 'ត្រូវការ link ពី bot — សូមបើក bot ហើយចុចប៊ូតុង «មើលអេក្រង់»។';
  if (bot) {
    hint.hidden = false;
    document.getElementById('botlink').href = 'https://t.me/' + bot;
    document.getElementById('botlink').textContent = '@' + bot;
  }
})();
</script>
</body>
</html>
