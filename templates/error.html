<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ code }} — PyApp Builder</title>
<style>
  body{margin:0;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Noto Sans Khmer",sans-serif;line-height:1.6}
  .wrap{max-width:640px;margin:0 auto;padding:60px 18px}
  .card{background:#161b22;border:1px solid #26303d;border-radius:14px;padding:24px}
  h1{font-size:20px;margin:0 0 10px;color:#f85149}
  p{color:#8b949e;margin:0 0 18px;white-space:pre-wrap}
  a{display:inline-block;background:#21262d;color:#e6edf3;border:1px solid #26303d;
    border-radius:10px;padding:11px 18px;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>{{ code }}</h1>
    <p>{{ msg }}</p>
    <a href="/">← ត្រឡប់ទៅសាយ</a>
  </div>
</div>
</body>
</html>
