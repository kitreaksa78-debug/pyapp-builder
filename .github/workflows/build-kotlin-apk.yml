name: build-kotlin-apk

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag for the APK (e.g. apk-1a2b3c4d5e6f)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    name: gradle assembleDebug (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12.0"
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Signature key
        run: |
          test -f signing/debug.p12 || (echo "missing signing/debug.p12" && exit 1)
          ls -l signing/debug.p12

      - name: Build APK (Kotlin)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find app/build/outputs/apk -name "*.apk" -print | head -1)
          test -n "$APK" || (echo "no APK produced" && exit 1)
          cp "$APK" out/app.apk
          ls -l out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: out/app.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body: "APK បង្កើតដោយ PyApp Builder (JavaScript + Kotlin WebView)."
          files: out/app.apk
