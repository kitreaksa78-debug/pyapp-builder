name: build-csharp-apk

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag for the APK (e.g. apk-1a2b3c4d5e6f)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    name: dotnet publish (C#)
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android workload
        run: |
          dotnet --version
          dotnet workload install android --skip-sign-check \
            || sudo dotnet workload install android --skip-sign-check
          dotnet workload list

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12.0"
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Signature key
        run: |
          test -f signing/debug.p12 || (echo "missing signing/debug.p12" && exit 1)
          ls -l signing/debug.p12

      - name: Build APK (C#)
        run: |
          dotnet publish -f net10.0-android -c Release \
            -p:AndroidPackageFormat=apk \
            -p:AndroidSigningKeyStore="$PWD/signing/debug.p12" \
            -p:AndroidSigningStorePass=android \
            -p:AndroidSigningKeyAlias=androiddebugkey \
            -p:AndroidSigningKeyPass=android

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find . -path ./out -prune -o -name "*-Signed.apk" -print | head -1)
          test -n "$APK" || (echo "no signed APK produced" && exit 1)
          cp "$APK" out/app.apk
          ls -l out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: out/app.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body: "APK បង្កើតដោយ PyApp Builder (C# · .NET for Android)."
          files: out/app.apk
