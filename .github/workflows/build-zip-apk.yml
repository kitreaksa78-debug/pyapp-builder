name: build-zip-apk

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag for the artifacts (e.g. apk-1a2b3c4d5e6f)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    name: build user project
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12.0"
          packages: "platform-tools platforms;android-34 platforms;android-35 build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Detect project type
        id: kind
        run: |
          set -e
          TYPE=android
          if [ -f pubspec.yaml ]; then
            TYPE=flutter
          elif [ -f package.json ] && grep -Eq '"(react-native|expo)"' package.json; then
            TYPE=reactnative
          fi
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "project type: $TYPE"

      - name: Read app metadata
        id: meta
        if: steps.kind.outputs.type != 'android'
        run: |
          set -e
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          meta = json.load(open(".pyapp-build.json", encoding="utf-8"))
          for key in ("package", "title", "name", "org", "version", "artifact"):
              print("%s=%s" % (key, meta.get(key, "")))
          PY

      - name: Validate project files
        if: steps.kind.outputs.type == 'android'
        run: |
          set -e
          test -f settings.gradle -o -f settings.gradle.kts || (echo "::error::missing settings.gradle(.kts)" && exit 1)
          test -f build.gradle -o -f build.gradle.kts || (echo "::error::missing build.gradle(.kts)" && exit 1)
          find . -name AndroidManifest.xml -not -path "*/build/*" | head -1 | grep -q . || (echo "::error::missing AndroidManifest.xml" && exit 1)
          echo "project files: $(find . -type f -not -path './.git/*' | wc -l)"

      - name: Pick gradle command
        if: steps.kind.outputs.type == 'android'
        run: |
          # gradlew ត្រូវការ gradle-wrapper.jar ដែរ — wrapper ចាស់ (< 8) មិន build AGP 8.x
          if [ -f gradlew ] && { [ -f gradle/wrapper/gradle-wrapper.jar ] || [ -f app/gradle/wrapper/gradle-wrapper.jar ]; }; then
            MAJOR=$(grep -oE 'gradle-[0-9]+(\.[0-9]+)+-(bin|all)' gradle/wrapper/gradle-wrapper.properties 2>/dev/null | head -1 | sed -E 's/gradle-([0-9]+).*/\1/')
            if [ -n "$MAJOR" ] && [ "$MAJOR" -ge 8 ]; then
              chmod +x gradlew
              echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
            else
              echo "wrapper ចាស់ (${MAJOR:-?}) → ប្រើ Gradle 8.7 ដែលដំឡើងរួច"
            fi
          fi
          [ -n "${GRADLE_CMD:-}" ] || echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"

      - name: Build APK
        if: steps.kind.outputs.type == 'android'
        run: |
          set -o pipefail
          $GRADLE_CMD assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      - name: Set up Flutter
        if: steps.kind.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter android shell
        if: steps.kind.outputs.type == 'flutter'
        env:
          PKG: ${{ steps.meta.outputs.package }}
          APP_NAME: ${{ steps.meta.outputs.name }}
          ORG: ${{ steps.meta.outputs.org }}
          TITLE: ${{ steps.meta.outputs.title }}
        run: |
          set -eo pipefail
          rm -rf .flutter_seed && mkdir -p .flutter_seed
          ( cd .flutter_seed && flutter create --platforms=android --org "$ORG" --project-name "$APP_NAME" --no-pub . )
          rm -rf android
          cp -a .flutter_seed/android android
          rm -rf .flutter_seed
          python3 - "$PKG" "$TITLE" <<'PY'
          import pathlib, re, sys

          pkg, title = sys.argv[1], sys.argv[2]
          path = pathlib.Path("android/app/build.gradle.kts")
          if not path.exists():
              path = pathlib.Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")
          text = re.sub(r'namespace\s*=?\s*"[^"]*"', 'namespace = "%s"' % pkg, text)
          text = re.sub(r'applicationId\s*=?\s*"[^"]*"', 'applicationId = "%s"' % pkg, text)
          path.write_text(text, encoding="utf-8")
          manifest = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              body = manifest.read_text(encoding="utf-8")
              label = (title.replace("&", "&amp;").replace('"', "&quot;")
                       .replace("<", "&lt;").replace("'", "&apos;"))
              body = re.sub(r'android:label="[^"]*"',
                            'android:label="%s"' % label, body, count=1)
              manifest.write_text(body, encoding="utf-8")
          print("flutter android package:", pkg)
          PY

      - name: Build Flutter artifacts
        if: steps.kind.outputs.type == 'flutter'
        env:
          ARTIFACT: ${{ steps.meta.outputs.artifact }}
        run: |
          set -o pipefail
          {
            flutter pub get
            flutter build apk --debug
            if [ "$ARTIFACT" = "aab" ] || [ "$ARTIFACT" = "both" ]; then
              flutter build appbundle --release
            fi
          } 2>&1 | tee build.log
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-debug.apk out/app.apk
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab out/app.aab
          fi

      - name: Set up Node 20
        if: steps.kind.outputs.type == 'reactnative'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build React Native artifacts
        if: steps.kind.outputs.type == 'reactnative'
        env:
          CI: "true"
          ARTIFACT: ${{ steps.meta.outputs.artifact }}
        run: |
          set -o pipefail
          {
            npm install --no-audit --no-fund --legacy-peer-deps
            npx --yes expo prebuild --platform android --no-install
            ( cd android && ./gradlew assembleDebug --no-daemon --stacktrace --console=plain )
            if [ "$ARTIFACT" = "aab" ] || [ "$ARTIFACT" = "both" ]; then
              ( cd android && ./gradlew bundleRelease --no-daemon --stacktrace --console=plain )
            fi
          } 2>&1 | tee build.log
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/app.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab out/app.aab
          fi

      - name: Collect artifacts
        if: always()
        run: |
          touch build.log
          mkdir -p out
          echo "build log lines: $(wc -l < build.log)"
          if [ ! -f out/app.apk ]; then
            APK=$(find . -path "*/build/outputs/apk/*.apk" -not -path "./out/*" -print 2>/dev/null | head -1)
            if [ -n "$APK" ]; then
              cp "$APK" out/app.apk
              echo "APK: $APK"
            else
              echo "::warning::no APK produced"
            fi
          fi
          ls -l out || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-artifacts
          path: |
            out/app.apk
            out/app.aab
            build.log
          if-no-files-found: warn

      - name: Publish release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body: "APK/AAB ពី project របស់អ្នក — Android (Gradle), Flutter (Flutter SDK) ឬ React Native (Expo)។"
          files: |
            out/app.apk
            out/app.aab
            build.log
          fail_on_unmatched_files: false
