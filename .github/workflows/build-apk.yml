name: build-apk

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag for the APK (e.g. apk-1a2b3c4d5e6f)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    name: buildozer android debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk-headless autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev \
            libssl-dev libltdl-dev

      - name: Buildozer
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install buildozer cython==0.29.36

      - name: Cache SDK/NDK and p4a builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v2-

      - name: Build APK
        run: buildozer -v android debug

      - name: Collect APK
        run: |
          mkdir -p out
          cp bin/*.apk out/app-debug.apk
          ls -l out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body: "APK បង្កើតដោយ PyApp Builder (Kivy + buildozer)."
          files: out/app-debug.apk
