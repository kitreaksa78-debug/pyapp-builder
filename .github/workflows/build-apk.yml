name: build-apk

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag for the APK (e.g. apk-1a2b3c4d5e6f)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    name: buildozer android debug
    runs-on: ubuntu-latest
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # python-for-android creates its build venv from `python` on PATH.
      # The runner's system python (3.14) ships a pip that breaks inside that
      # venv, so pin `python`/`python3` to the 3.11 we just installed.
      - name: Pin python to 3.11
        run: |
          mkdir -p "$HOME/pyshim"
          ln -sf "$(command -v python3)" "$HOME/pyshim/python"
          ln -sf "$(command -v python3)" "$HOME/pyshim/python3"
          echo "$HOME/pyshim" >> "$GITHUB_PATH"
          "$HOME/pyshim/python" --version

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk-headless autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev \
            libssl-dev libltdl-dev

      - name: Buildozer
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install buildozer "cython<3"
          python --version
          head -1 "$(command -v buildozer)"

      - name: Cache SDK/NDK and p4a builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v3-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v3-

      - name: Build APK
        run: buildozer -v android debug

      - name: Collect APK
        run: |
          mkdir -p out
          cp bin/*.apk out/app-debug.apk
          ls -l out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body: "APK បង្កើតដោយ PyApp Builder (Kivy + buildozer)."
          files: out/app-debug.apk
