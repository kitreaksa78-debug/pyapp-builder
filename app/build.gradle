plugins {
    id 'com.android.application'
}

android {
    namespace 'myproject'
    compileSdk 36

    defaultConfig {
        applicationId "com.pool.overlaymenu"
        minSdk 26
        //noinspection ExpiredTargetSdkVersion,OldTargetApi
        targetSdk 28
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'

    // Replace these old lines:
    // androidTestImplementation 'com.android.support.test:runner:1.0.2'
    // androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'

    // With these new AndroidX dependencies:
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0' // For JUnit4 test rules and runners
}

// Keep Kotlin bytecode target aligned with Java 17 (fixes JVM target mismatch).
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '17'
    }
}

// PyApp Builder: Kotlin 1.8+ merged jdk7/jdk8 into kotlin-stdlib.
// Old transitive jdk7/jdk8 artifacts duplicate classes in the APK.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' &&
                (details.requested.name == 'kotlin-stdlib-jdk7' ||
                 details.requested.name == 'kotlin-stdlib-jdk8')) {
            details.useVersion '1.8.22'
        }
    }
}
