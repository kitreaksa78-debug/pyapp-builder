<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:,">
  <meta name="theme-color" content="#0b1220">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<title>City Drive — World</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1220; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, "Noto Sans Khmer", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at center, transparent 54%, rgba(0,0,0,0.4) 100%);
  }
  #hud {
    position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px;
    display: flex; gap: 8px; align-items: center; pointer-events: none; z-index: 3;
  }
  .chip {
    background: rgba(8, 14, 24, 0.6); color: #eaf2ff;
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 10px; padding: 7px 11px; font-size: 12.5px;
    backdrop-filter: blur(8px);
  }
  #speed b { font-size: 18px; letter-spacing: 0.5px; }
  #speed span { opacity: 0.65; font-size: 11px; margin-left: 3px; }
  #topRight {
    position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px;
    display: flex; gap: 8px; z-index: 4;
  }
  #topRight .chip { pointer-events: auto; cursor: pointer; }
  #topRight .chip:active { transform: scale(0.96); }
  .pad {
    position: fixed; bottom: max(26px, calc(env(safe-area-inset-bottom) + 14px));
    z-index: 5;
  }
  #padR {
    right: 14px;
    display: flex; flex-direction: column; gap: 12px; align-items: center;
  }
  #footPad, #carPad { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  #carPad { display: none; }
  body.driving #footPad { display: none; }
  body.driving #carPad { display: flex; }
  /* steering arrows only while driving, like GTA SA */
  #padL {
    position: fixed; left: 18px; bottom: max(34px, calc(env(safe-area-inset-bottom) + 22px));
    display: none; gap: 18px; z-index: 5;
  }
  body.driving #padL { display: flex; }
  body.driving #stick { display: none; }
  #padL .btn.round { width: 76px; height: 76px; font-size: 26px; }
  /* map zoom / close controls */
  #mapUI {
    position: fixed; right: 14px; bottom: 26px; z-index: 31;
    display: none; flex-direction: column; gap: 10px;
  }
  .mbtn {
    width: 52px; height: 52px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.32);
    background: rgba(14,22,34,0.72); color: #eaf3ff; font-size: 22px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    backdrop-filter: blur(8px); font-family: inherit;
  }
  /* analog stick, like GTA SA on mobile */
  #stick {
    position: fixed; left: 18px; bottom: max(30px, calc(env(safe-area-inset-bottom) + 18px));
    width: 132px; height: 132px; border-radius: 50%;
    background: radial-gradient(circle, rgba(18,26,40,0.42), rgba(10,16,26,0.62));
    border: 2px solid rgba(255,255,255,0.28);
    box-shadow: 0 8px 22px rgba(0,0,0,0.4), inset 0 0 22px rgba(0,0,0,0.35);
    z-index: 5; touch-action: none; backdrop-filter: blur(6px);
  }
  #stickRing {
    position: absolute; inset: 26px; border-radius: 50%;
    border: 1px dashed rgba(255,255,255,0.16);
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 58px; height: 58px;
    margin: -29px 0 0 -29px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, #b9c6d8 70%, #8b98ab);
    border: 2px solid rgba(255,255,255,0.75);
    box-shadow: 0 6px 16px rgba(0,0,0,0.45);
    transition: none;
  }
  .btn {
    width: 74px; height: 74px; border-radius: 20px;
    display: grid; place-items: center;
    background: rgba(10, 16, 28, 0.5);
    border: 1px solid rgba(255,255,255,0.22);
    color: #eaf2ff; font-size: 26px; line-height: 1;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    transition: transform 0.06s ease, background 0.06s ease;
  }
  .btn:active, .btn.on { transform: scale(0.94); background: rgba(79,140,255,0.55); }
  .btn small { display: block; font-size: 10px; opacity: 0.72; margin-top: 2px; }
  .btn.round {
    width: 62px; height: 62px; border-radius: 50%; font-size: 24px;
    background: rgba(12,18,30,0.55); border: 2px solid rgba(255,255,255,0.34);
  }
  .btn.round.on { background: rgba(79,140,255,0.6); }
  #boot {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: linear-gradient(160deg, #0b1220, #14213d 60%, #1b1030);
    color: #eaf2ff; transition: opacity 0.5s ease;
  }
  #boot.hide { opacity: 0; pointer-events: none; }
  #boot .box { text-align: center; padding: 24px; }
  #boot h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: 0.5px; }
  #boot p { margin: 0; color: #9fb3d1; font-size: 13px; line-height: 1.7; }
  #boot .go {
    margin-top: 18px; padding: 13px 26px; border-radius: 12px; border: 0;
    background: linear-gradient(150deg, #4f8cff, #7c5cff); color: #fff;
    font: inherit; font-weight: 700; font-size: 15px; cursor: pointer;
  }
  #boot .bar { width: 200px; height: 4px; margin: 18px auto 0; border-radius: 99px; background: rgba(255,255,255,0.14); overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#4f8cff,#7c5cff); animation: load 1.4s ease forwards; }
  @keyframes load { to { width: 100%; } }
  #worldmap {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 30; display: none; background: rgba(6, 12, 20, 0.94);
    touch-action: none;
  }
  #mini {
    position: fixed; top: 58px; right: 12px; width: 138px; height: 138px;
    border-radius: 50%; border: 2px solid rgba(255,255,255,0.3);
    box-shadow: 0 10px 26px rgba(0,0,0,0.45); z-index: 4; pointer-events: auto;
    background: #1d232b; cursor: pointer;
  }
  #talk { position: fixed; inset: 0; pointer-events: none; z-index: 6; overflow: hidden; }
  .bubble {
    position: absolute; top: 0; left: 0;
    transform: translate(-50%, -100%);
    background: rgba(12, 18, 30, 0.82); color: #eef6ff;
    border: 1px solid rgba(255,255,255,0.24);
    border-radius: 12px; padding: 6px 10px; font-size: 13px; line-height: 1.35;
    white-space: nowrap; backdrop-filter: blur(6px);
    font-family: "Noto Sans Khmer", "Khmer OS", system-ui, sans-serif;
    opacity: 0; transition: opacity 0.25s ease;
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -5px; width: 9px; height: 9px;
    background: rgba(12, 18, 30, 0.82); border-right: 1px solid rgba(255,255,255,0.24);
    border-bottom: 1px solid rgba(255,255,255,0.24);
    transform: translateX(-50%) rotate(45deg);
  }
  #hint {
    position: fixed; left: 50%; bottom: max(168px, calc(env(safe-area-inset-bottom) + 150px));
    transform: translateX(-50%); z-index: 5; pointer-events: none;
    background: rgba(8, 14, 24, 0.55); color: #dce9ff;
    border: 1px solid rgba(255,255,255,0.14); border-radius: 10px;
    padding: 6px 12px; font-size: 12px; backdrop-filter: blur(8px);
    transition: opacity 0.4s ease;
  }
  @media (max-width: 420px) {
    #mini { width: 108px; height: 108px; top: 56px; right: 10px; }
    #stick { width: 116px; height: 116px; left: 14px; }
    #padL .btn.round { width: 68px; height: 68px; font-size: 23px; }
    .mbtn { width: 46px; height: 46px; font-size: 20px; }
    #knob { width: 52px; height: 52px; margin: -26px 0 0 -26px; }
    .btn.round { width: 56px; height: 56px; font-size: 21px; }
    .btn { width: 66px; height: 66px; font-size: 23px; border-radius: 18px; }
    #padR .btn { width: 76px; height: 76px; }
  }
</style>
</head>
<body>
  <div id="vignette"></div>

  <div id="hud">
    <div class="chip" id="speed"><b>0</b><span>km/h</span></div>
    <div class="chip" id="clock">—</div>
  </div>
  <div id="topRight">
    <div class="chip" id="exitBtn">🚶</div>
    <div class="chip" id="musicBtn">🔊</div>
    <div class="chip" id="nightBtn">🌙 យប់</div>
    <div class="chip" id="qBtn">HD</div>
  </div>
  <canvas id="mini" width="148" height="148"></canvas>
  <canvas id="worldmap"></canvas>
  <div id="hint">អូស joystick ដើរ/បើកបរ · អូសអេក្រង់មើលជុំវិញ · 🚗 ឡើង/ចុះឡាន · ចុច radar</div>

  <div id="stick">
    <div id="stickRing"></div>
    <div id="knob"></div>
  </div>
  <div class="pad" id="padL">
    <div class="btn round" data-k="left">◀</div>
    <div class="btn round" data-k="right">▶</div>
  </div>
  <div class="pad" id="padR">
    <div id="footPad">
      <div class="btn round" id="jumpBtn" data-k="jump">⤒</div>
      <div class="btn round" id="runBtn" data-k="run">🏃</div>
    </div>
    <div id="carPad">
      <div class="btn round" data-k="gas">▲</div>
      <div class="btn round" data-k="brake">▼</div>
    </div>
    <div class="btn round" id="carBtn">🚗</div>
  </div>

  <div id="mapUI">
    <button class="mbtn" id="mapIn">＋</button>
    <button class="mbtn" id="mapOut">−</button>
    <button class="mbtn" id="mapHome">⤢</button>
    <button class="mbtn" id="mapClose">✕</button>
  </div>

  <div id="boot">
    <div class="box">
      <h1>City Drive — World</h1>
      <p>ទីក្រុងធំ · ភ្នំ · មនុស្ស · ចរាចរណ៍<br>Touch ឬ WASD</p>
      <div class="bar"><i></i></div>
      <button class="go" id="go">ចាប់ផ្ដើមបើកបរ</button>
    </div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* --------------------------------- setup --------------------------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.35));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.94;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xbcd6f5, 320, 3000);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.3, 4000);
camera.position.set(0, 9, -16);

/* HDR chain: scene -> bloom (linear) -> ACES tone map + sRGB */
const composer = new EffectComposer(renderer);
composer.setPixelRatio(1);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.32, 0.55, 0.9
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* --------------------------------- world --------------------------------- */
const GRID = 30;               // blocks per side
const BLOCK = 50;
const ROAD = 18;
const SPACING = BLOCK + ROAD;
const HALF = (GRID * SPACING) / 2;
const CITY_R = HALF + SPACING / 2;

/* ---------------------------------- sky ---------------------------------- */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {
    topColor: { value: new THREE.Color(0x2f6bd8).convertSRGBToLinear() },
    midColor: { value: new THREE.Color(0x8fc0ff).convertSRGBToLinear() },
    bottomColor: { value: new THREE.Color(0xe6f0ff).convertSRGBToLinear() },
    offset: { value: 60 }, exponent: { value: 0.95 }
  },
  vertexShader: `varying vec3 vWorld; void main(){ vec4 wp = modelMatrix * vec4(position,1.0); vWorld = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }`,
  fragmentShader: `
    uniform vec3 topColor; uniform vec3 midColor; uniform vec3 bottomColor;
    uniform float offset; uniform float exponent; varying vec3 vWorld;
    void main(){
      float h = normalize(vWorld + vec3(0.0, offset, 0.0)).y;
      vec3 c = mix(bottomColor, midColor, smoothstep(0.0, 0.32, h));
      c = mix(c, topColor, pow(smoothstep(0.22, 1.0, h), exponent));
      gl_FragColor = vec4(c, 1.0);
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(2200, 32, 20), skyMat);
scene.add(sky);

/* sun sprite */
function radialSprite(inner, outer) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 2, 64, 64, 62);
  grd.addColorStop(0, inner); grd.addColorStop(0.45, outer); grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: radialSprite('rgba(255,252,235,1)', 'rgba(255,214,150,0.55)'),
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
}));
sunSprite.scale.setScalar(260);
sunSprite.position.set(700, 850, 500);
scene.add(sunSprite);

/* clouds */
const cloudTex = (() => {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  for (let i = 0; i < 26; i++) {
    const x = 40 + Math.random() * 176, y = 45 + Math.random() * 45, r = 18 + Math.random() * 30;
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, 'rgba(255,255,255,0.85)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const clouds = [];
for (let i = 0; i < 16; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: cloudTex, transparent: true, depthWrite: false, opacity: 0.75 - Math.random() * 0.25
  }));
  const a = Math.random() * Math.PI * 2, r = 500 + Math.random() * 1100;
  s.position.set(Math.cos(a) * r, 330 + Math.random() * 260, Math.sin(a) * r);
  s.scale.set(420 + Math.random() * 320, 170 + Math.random() * 120, 1);
  s.userData.speed = 2 + Math.random() * 3;
  scene.add(s); clouds.push(s);
}

/* -------------------------------- lights --------------------------------- */
const hemi = new THREE.HemisphereLight(0xdcecff, 0x46503a, 1.0);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2d6, 3.1);
sun.position.set(200, 320, 160);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 20;
sun.shadow.camera.far = 900;
const SH = 95;
sun.shadow.camera.left = -SH; sun.shadow.camera.right = SH;
sun.shadow.camera.top = SH; sun.shadow.camera.bottom = -SH;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.35;
scene.add(sun, sun.target);

/* -------------------------------- textures -------------------------------- */
function makeTex(draw, size, repeat) {
  const c = document.createElement('canvas'); c.width = c.height = size || 256;
  draw(c.getContext('2d'), c.width, c.height);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (repeat) t.repeat.set(repeat, repeat);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

const grassTex = makeTex((g, w, h) => {
  g.fillStyle = '#4f7a3a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 12000; i++) {
    const v = 60 + Math.random() * 90;
    g.fillStyle = 'rgba(' + (v * 0.55) + ',' + v + ',' + (v * 0.42) + ',0.5)';
    g.fillRect(Math.random() * w, Math.random() * h, 1.5, 2.5);
  }
}, 256, 90);

const concreteTex = makeTex((g, w, h) => {
  g.fillStyle = '#9aa0aa'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2200; i++) {
    const v = 120 + Math.random() * 70;
    g.fillStyle = 'rgba(' + v + ',' + v + ',' + (v + 4) + ',0.22)';
    g.fillRect(Math.random() * w, Math.random() * h, 2, 2);
  }
  g.strokeStyle = 'rgba(60,66,76,0.3)'; g.lineWidth = 2;
  for (let i = 0; i <= w; i += 32) {
    g.beginPath(); g.moveTo(i, 0); g.lineTo(i, h); g.stroke();
    g.beginPath(); g.moveTo(0, i); g.lineTo(w, i); g.stroke();
  }
}, 128, 3);

const asphaltTex = makeTex((g, w, h) => {
  g.fillStyle = '#34393f'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 12000; i++) {
    const v = 32 + Math.random() * 48;
    g.fillStyle = 'rgba(' + v + ',' + v + ',' + (v + 3) + ',0.5)';
    g.fillRect(Math.random() * w, Math.random() * h, 1.6, 1.6);
  }
}, 256, 110);

/* facade tiles: one tile = 5.2m x 5.6m = 2 floors, 2 window bays */
function makeFacade(style) {
  const W = 256, H = 512;
  const base = document.createElement('canvas'); base.width = W; base.height = H;
  const g = base.getContext('2d');
  const glow = document.createElement('canvas'); glow.width = W; glow.height = H;
  const e = glow.getContext('2d');
  e.fillStyle = '#000'; e.fillRect(0, 0, W, H);

  const FLOOR = H / 2;          // one storey
  const BAY = W / 2;            // one window bay
  let rough = 0.85, metal = 0.05;

  if (style === 0) {
    // glass curtain wall: dark spandrel + reflective glass per floor
    rough = 0.34; metal = 0.18;
    g.fillStyle = '#556a80'; g.fillRect(0, 0, W, H);
    for (let f = 0; f < 2; f++) {
      const y0 = f * FLOOR;
      const sp = FLOOR * 0.2;                       // spandrel panel
      g.fillStyle = '#39414d'; g.fillRect(0, y0 + FLOOR - sp, W, sp);
      const grad = g.createLinearGradient(0, y0, 0, y0 + FLOOR - sp);
      grad.addColorStop(0, '#b8d4ee');
      grad.addColorStop(0.45, '#7897b6');
      grad.addColorStop(1, '#425a70');
      g.fillStyle = grad; g.fillRect(2, y0 + 4, W - 4, FLOOR - sp - 6);
      g.fillStyle = 'rgba(24,32,42,0.9)';
      g.fillRect(BAY - 3, y0, 6, FLOOR - sp);       // mullion
      g.fillStyle = 'rgba(255,255,255,0.10)';
      g.fillRect(6, y0 + 8, W - 12, 10);            // sky reflection
      if (Math.random() < 0.45) {
        e.fillStyle = 'rgba(205,228,255,0.85)';
        const w = BAY - 12, bx = Math.random() < 0.5 ? 6 : BAY + 6;
        e.fillRect(bx, y0 + 10, w, FLOOR - sp - 16);
      }
    }
  } else if (style === 1) {
    // brick / stucco residential
    g.fillStyle = '#9b6a55'; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 4000; i++) {
      const v = 140 + Math.random() * 50;
      g.fillStyle = 'rgba(' + (v | 0) + ',' + ((v * 0.66) | 0) + ',' + ((v * 0.55) | 0) + ',0.35)';
      g.fillRect(Math.random() * W, Math.random() * H, 5, 2.5);
    }
    for (let f = 0; f < 2; f++) {
      for (let c = 0; c < 2; c++) {
        const x = c * BAY + BAY * 0.2, y = f * FLOOR + FLOOR * 0.2;
        const w = BAY * 0.6, h = FLOOR * 0.48;
        g.fillStyle = '#2b3038'; g.fillRect(x - 3, y - 3, w + 6, h + 6);
        const gr = g.createLinearGradient(0, y, 0, y + h);
        gr.addColorStop(0, '#8fb0cc'); gr.addColorStop(0.6, '#4e6478'); gr.addColorStop(1, '#2f3a45');
        g.fillStyle = gr; g.fillRect(x, y, w, h);
        g.fillStyle = 'rgba(230,232,228,0.95)'; g.fillRect(x - 6, y + h, w + 12, 7);
        g.fillStyle = 'rgba(20,24,28,0.55)'; g.fillRect(x + w / 2 - 1.5, y, 3, h);
        if (Math.random() < 0.35) {
          e.fillStyle = 'rgba(255,214,150,1)';
          e.fillRect(x, y, w, h);
        }
      }
    }
  } else {
    // concrete office with punched windows
    g.fillStyle = '#98a0a9'; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 3000; i++) {
      const v = 130 + Math.random() * 55;
      g.fillStyle = 'rgba(' + (v | 0) + ',' + (v | 0) + ',' + ((v + 6) | 0) + ',0.32)';
      g.fillRect(Math.random() * W, Math.random() * H, 3, 3);
    }
    for (let f = 0; f < 2; f++) {
      for (let c = 0; c < 2; c++) {
        const x = c * BAY + BAY * 0.24, y = f * FLOOR + FLOOR * 0.24;
        const w = BAY * 0.52, h = FLOOR * 0.42;
        g.fillStyle = '#1f262f'; g.fillRect(x, y, w, h);
        const gr = g.createLinearGradient(0, y, 0, y + h);
        gr.addColorStop(0, 'rgba(150,178,205,0.75)'); gr.addColorStop(1, 'rgba(40,52,64,0.9)');
        g.fillStyle = gr; g.fillRect(x, y, w, h);
        if (Math.random() < 0.4) {
          e.fillStyle = 'rgba(255,206,150,1)';
          e.fillRect(x, y, w, h);
        }
      }
    }
  }

  const map = new THREE.CanvasTexture(base);
  map.colorSpace = THREE.SRGBColorSpace; map.wrapS = map.wrapT = THREE.RepeatWrapping;
  map.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const em = new THREE.CanvasTexture(glow);
  em.colorSpace = THREE.SRGBColorSpace; em.wrapS = em.wrapT = THREE.RepeatWrapping;
  return { map, em, rough, metal };
}

/* -------------------------------- terrain -------------------------------- */
function smoothstep(a, b, x) {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}
function noise2(x, z) {
  return Math.sin(x) * Math.cos(z) * 0.5 +
    Math.sin(x * 1.7 + 2.1) * Math.cos(z * 1.3 - 1.2) * 0.3 +
    Math.sin(x * 3.1 - 0.7) * Math.cos(z * 2.7 + 0.4) * 0.2;
}

const T_SIZE = 3600, T_SEG = 150;
const terrainGeo = new THREE.PlaneGeometry(T_SIZE, T_SIZE, T_SEG, T_SEG);
terrainGeo.rotateX(-Math.PI / 2);
{
  const pos = terrainGeo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const col = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const r = Math.hypot(x, z);
    const t = smoothstep(CITY_R + 36, CITY_R + 520, r);
    let h = 0;
    if (t > 0) {
      h = (noise2(x * 0.0042, z * 0.0042) * 9 + noise2(x * 0.012 + 5, z * 0.009 + 3) * 3 + 1.5) * t;
      const m = smoothstep(CITY_R + 1300, CITY_R + 2300, r);
      h += m * (95 + noise2(x * 0.0026 + 9, z * 0.0026 + 4) * 160);
    }
    pos.setY(i, h - 0.45);

    if (h < 1.5) col.setHex(0x4a7638);
    else if (h < 28) col.setHex(0x4a7638).lerp(new THREE.Color(0x6d7c52), (h - 1.5) / 26);
    else if (h < 110) col.setHex(0x6d7c52).lerp(new THREE.Color(0x8c8779), (h - 28) / 82);
    else col.setHex(0x9aa0a8).lerp(new THREE.Color(0xf2f6ff), Math.min(1, (h - 110) / 90));

    colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
  }
  terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  terrainGeo.computeVertexNormals();
}

/* --------------------------------- the car -------------------------------- */
function makeCar(color, opts) {
  const o = opts || {};
  const g = new THREE.Group();
  const paint = new THREE.MeshPhysicalMaterial({
    color, metalness: 0.12, roughness: 0.36, clearcoat: 0.55, clearcoatRoughness: 0.2,
    envMapIntensity: 0.35
  });
  const dark = new THREE.MeshStandardMaterial({ color: 0x14181f, roughness: 0.7 });
  const glass = new THREE.MeshPhysicalMaterial({
    color: 0x121a24, metalness: 0.1, roughness: 0.16, clearcoat: 0.6, envMapIntensity: 0.4
  });
  const chrome = new THREE.MeshStandardMaterial({ color: 0xc9d2df, metalness: 1, roughness: 0.22 });

  // body shell: a side profile extruded across the width (hood, rake, roof, boot)
  const bodyShape = new THREE.Shape();
  bodyShape.moveTo(-2.2, 0.4);
  bodyShape.lineTo(2.2, 0.4);
  bodyShape.quadraticCurveTo(2.34, 0.46, 2.3, 0.68);      // front bumper corner
  bodyShape.quadraticCurveTo(2.26, 0.9, 2.04, 1.0);       // nose
  bodyShape.quadraticCurveTo(1.62, 1.08, 1.16, 1.1);      // bonnet
  bodyShape.quadraticCurveTo(0.86, 1.12, 0.7, 1.17);      // cowl
  bodyShape.lineTo(-1.02, 1.19);                          // waist line
  bodyShape.quadraticCurveTo(-1.66, 1.18, -1.94, 1.1);    // boot lid
  bodyShape.quadraticCurveTo(-2.16, 1.03, -2.2, 0.86);    // tail
  bodyShape.closePath();
  const bodyGeo = new THREE.ExtrudeGeometry(bodyShape, {
    depth: 1.8, bevelEnabled: true, bevelSize: 0.17, bevelThickness: 0.16,
    bevelSegments: 5, curveSegments: 10, steps: 1
  });
  bodyGeo.rotateY(-Math.PI / 2);
  bodyGeo.translate(0.92, 0, 0);
  bodyGeo.computeVertexNormals();
  const body = new THREE.Mesh(bodyGeo, paint);
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);

  // greenhouse: dark glass wedge + painted roof cap
  const cabShape = new THREE.Shape();
  cabShape.moveTo(-1.08, 1.1);
  cabShape.lineTo(0.66, 1.1);
  cabShape.quadraticCurveTo(0.46, 1.34, 0.28, 1.6);       // windscreen rake
  cabShape.quadraticCurveTo(0.1, 1.7, -0.26, 1.71);       // roof
  cabShape.quadraticCurveTo(-0.66, 1.7, -0.84, 1.5);      // rear screen
  cabShape.lineTo(-1.04, 1.24);
  cabShape.closePath();
  const cabGeo = new THREE.ExtrudeGeometry(cabShape, {
    depth: 1.56, bevelEnabled: true, bevelSize: 0.06, bevelThickness: 0.06,
    bevelSegments: 3, curveSegments: 8
  });
  cabGeo.rotateY(-Math.PI / 2);
  cabGeo.translate(0.8, 0, 0);
  cabGeo.computeVertexNormals();
  const cabin = new THREE.Mesh(cabGeo, glass);
  cabin.castShadow = true;
  g.add(cabin);

  const roof = new THREE.Mesh(new THREE.BoxGeometry(1.42, 0.07, 0.92), paint);
  roof.position.set(0, 1.685, -0.13);
  roof.castShadow = true;
  g.add(roof);

  // side sills, boot spoiler, door handles
  [-1, 1].forEach((sx) => {
    const sill = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.14, 2.5), dark);
    sill.position.set(sx * 0.98, 0.46, -0.1);
    g.add(sill);
    const handle = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.05, 0.22), chrome);
    handle.position.set(sx * 1.01, 1.02, 0.1);
    g.add(handle);
  });
  const spoiler = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.06, 0.3), paint);
  spoiler.position.set(0, 1.2, -1.86);
  spoiler.castShadow = true;
  g.add(spoiler);
  const plate = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.16, 0.04),
    new THREE.MeshStandardMaterial({ color: 0xf2f4f7, roughness: 0.6 }));
  plate.position.set(0, 0.72, -2.32);
  g.add(plate);

  // mirrors
  const m1 = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.12, 0.18), dark);
  m1.position.set(-0.98, 1.24, 0.62); g.add(m1);
  const m2 = m1.clone(); m2.position.x = 0.98; g.add(m2);

  // grille + lights
  const grille = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.22, 0.06), dark);
  grille.position.set(0, 0.86, 2.26); g.add(grille);
  const headMat = new THREE.MeshStandardMaterial({ color: 0xfff8e2, emissive: 0xfff0c0, emissiveIntensity: 1.8, roughness: 0.25 });
  [-0.62, 0.62].forEach((x) => {
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.18, 0.08), headMat);
    hl.position.set(x, 0.96, 2.26); g.add(hl);
  });
  const tailMat = new THREE.MeshStandardMaterial({ color: 0x7a1414, emissive: 0xff2a2a, emissiveIntensity: 0.9, roughness: 0.35 });
  [-0.66, 0.66].forEach((x) => {
    const tl = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.16, 0.08), tailMat);
    tl.position.set(x, 0.96, -2.26); g.add(tl);
  });

  // bumpers
  const bf = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.26, 0.2), dark);
  bf.position.set(0, 0.56, 2.28); g.add(bf);
  const bb = bf.clone(); bb.position.z = -2.28; g.add(bb);

  // wheels + rims (front pair steer; all four roll with vehicle speed)
  g.userData.wheels = [];
  const wheelGeo = new THREE.CylinderGeometry(0.46, 0.46, 0.38, 16);
  const rimGeo = new THREE.CylinderGeometry(0.26, 0.26, 0.4, 12);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x0d1015, roughness: 0.95 });
  [[-1.02, 0.46, 1.45], [1.02, 0.46, 1.45], [-1.02, 0.46, -1.45], [1.02, 0.46, -1.45]].forEach(([x, y, z], wi) => {
    const pivot = new THREE.Group();
    pivot.position.set(x, y, z);
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI / 2; w.castShadow = true; pivot.add(w);
    const r = new THREE.Mesh(rimGeo, chrome);
    r.rotation.z = Math.PI / 2; r.position.x = x > 0 ? 0.04 : -0.04; pivot.add(r);
    g.add(pivot);
    g.userData.wheels.push({ pivot, wheel: w, front: wi < 2 });
  });

  // exhaust
  const ex = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.2, 8), chrome);
  ex.rotation.x = Math.PI / 2; ex.position.set(0.6, 0.5, -2.32); g.add(ex);

  if (o.lights) {
    const l1 = new THREE.SpotLight(0xfff1c9, 0, 70, Math.PI / 7, 0.5, 1.4);
    l1.position.set(-0.6, 0.95, 2.2);
    l1.target.position.set(-0.6, 0, 26);
    const l2 = l1.clone();
    l2.position.x = 0.6; l2.target.position.x = 0.6;
    g.add(l1, l1.target, l2, l2.target);
    g.userData.headlights = [l1, l2];
  }

  g.scale.setScalar(o.scale || 1);
  return g;
}

/* ------------------------------- pedestrians ------------------------------ */
/* articulated crowd: shared geometry, one instanced mesh per body part, six draw
   calls for thousands of people. Everyone walks, some run, some stand, some hop,
   and a share of them cross the road at random, like a real street.
   (structure follows three.js PersonGenerator: per-instance variety, no per-person mesh) */
const PED = 1400; // balanced Android crowd budget; still gives a populated city
const peds = [];
const shirtColors = [0xe0533f, 0x3f7ee0, 0x2fa36b, 0xe0b23f, 0x8a4fd6, 0xe8e2d6, 0x2b3038, 0xd66fa0, 0x9fd3e8, 0xf2f2f2];
const trouserColors = [0x2b3038, 0x3b4250, 0x5a4b3a, 0x1f2937, 0x6b7280, 0x8a7a63];
const skinColors = [0xd9b79a, 0xc99a72, 0xb0805a, 0xe3c2a4, 0xa87a55];
const hairColors = [0x1a1410, 0x2b1d14, 0x0d0d0f, 0x3a2a1c, 0x5b4632];

function pedPart(geo) {
  const m = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ roughness: 0.9 }), PED);
  m.castShadow = false;   // thousands of tiny figures: shadows cost more than they add
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(m);
  return m;
}
const pedTorso = pedPart(new THREE.CapsuleGeometry(0.19, 0.46, 3, 8));
const pedHead = pedPart(new THREE.SphereGeometry(0.2, 8, 6));
const pedHair = pedPart(new THREE.SphereGeometry(0.203, 8, 5));
const armGeoP = new THREE.BoxGeometry(0.1, 0.52, 0.12).translate(0, -0.26, 0);
const legGeoP = new THREE.BoxGeometry(0.16, 0.76, 0.19).translate(0, -0.38, 0);
const pedArmL = pedPart(armGeoP);
const pedArmR = pedPart(armGeoP);
const pedLegL = pedPart(legGeoP);
const pedLegR = pedPart(legGeoP);

const pedMeshes = [pedTorso, pedHead, pedHair, pedArmL, pedArmR, pedLegL, pedLegR];

for (let i = 0; i < PED; i++) {
  const shirt = shirtColors[(Math.random() * shirtColors.length) | 0];
  const trouser = trouserColors[(Math.random() * trouserColors.length) | 0];
  const skin = skinColors[(Math.random() * skinColors.length) | 0];
  const hair = hairColors[(Math.random() * hairColors.length) | 0];
  const h = 0.88 + Math.random() * 0.26;
  const phase = Math.random() * Math.PI * 2;
  const roll = Math.random();
  const mode = roll < 0.11 ? 'run' : roll < 0.24 ? 'stand' : 'walk';

  let p;
  if (Math.random() < 0.09) {
    // someone crossing the road, back and forth along the same crossing
    const axis = Math.random() < 0.5 ? 'x' : 'z';
    const roadIdx = (Math.random() * (GRID + 1)) | 0;
    const lane = -HALF + roadIdx * SPACING;
    p = {
      kind: 'cross', axis, lane, along: -HALF + SPACING * 2 + Math.random() * (HALF * 2 - SPACING * 4),
      ct: Math.random(), cdir: Math.random() < 0.5 ? 1 : -1, pause: 0,
      speed: 1.0 + Math.random() * 0.9, mode: mode === 'stand' ? 'walk' : mode,
      phase, h, shirt, trouser, skin, hair
    };
  } else {
    const dense = Math.random() < 0.3;
    const gx = dense ? ((GRID / 2 - 5 + Math.random() * 10) | 0) : ((Math.random() * GRID) | 0);
    const gz = dense ? ((GRID / 2 - 5 + Math.random() * 10) | 0) : ((Math.random() * GRID) | 0);
    p = {
      kind: 'block',
      cx: (gx - (GRID - 1) / 2) * SPACING,
      cz: (gz - (GRID - 1) / 2) * SPACING,
      t: Math.random() * (BLOCK - 3.4) * 4,
      dir: Math.random() < 0.5 ? 1 : -1,
      speed: 1.0 + Math.random() * 1.3, mode, phase, h,
      hop: Math.random() < 0.18,
      shirt, trouser, skin, hair
    };
  }
  peds.push(p);

  pedTorso.setColorAt(i, new THREE.Color(shirt));
  pedArmL.setColorAt(i, new THREE.Color(shirt));
  pedArmR.setColorAt(i, new THREE.Color(shirt));
  pedLegL.setColorAt(i, new THREE.Color(trouser));
  pedLegR.setColorAt(i, new THREE.Color(trouser));
  pedHead.setColorAt(i, new THREE.Color(skin));
  pedHair.setColorAt(i, new THREE.Color(hair));
}
for (const m of pedMeshes) if (m.instanceColor) m.instanceColor.needsUpdate = true;

const pedM = new THREE.Matrix4();
const pedL = new THREE.Matrix4();
const pedQ = new THREE.Quaternion();
const pedQ2 = new THREE.Quaternion();
const pedV = new THREE.Vector3();
const pedV2 = new THREE.Vector3();
const pedS = new THREE.Vector3(1, 1, 1);
const UP = new THREE.Vector3(0, 1, 0);
const XAXIS = new THREE.Vector3(1, 0, 0);

/* the pavement ring around one block */
function pedPosAlongBlock(p) {
  const b = BLOCK - 3.4;   // stay inside the curb: 46.6 m ring, buildings reach 20.9 m
  const per = 4 * b;
  let u = ((p.t % per) + per) % per;
  if (u < b) return { x: p.cx - b / 2 + u, z: p.cz - b / 2, ax: 1, az: 0 };
  u -= b;
  if (u < b) return { x: p.cx + b / 2, z: p.cz - b / 2 + u, ax: 0, az: 1 };
  u -= b;
  if (u < b) return { x: p.cx + b / 2 - u, z: p.cz + b / 2, ax: -1, az: 0 };
  u -= b;
  return { x: p.cx - b / 2, z: p.cz + b / 2 - u, ax: 0, az: -1 };
}

function placePart(mesh, i, x, z, yaw, ox, oy, oz, swing, h) {
  pedV.set(x, 0, z);
  pedQ.setFromAxisAngle(UP, yaw);
  pedS.set(1, 1, 1);
  pedM.compose(pedV, pedQ, pedS);

  pedV2.set(ox, oy, oz);
  pedQ2.setFromAxisAngle(XAXIS, swing);
  pedS.set(h, h, h);
  pedL.compose(pedV2, pedQ2, pedS);
  pedM.multiply(pedL);
  mesh.setMatrixAt(i, pedM);
}

const NEAR2 = 135 * 135; // update detailed crowd animation near the camera only

function updatePeds(dt, time, force) {
  const cxp = camera.position.x, czp = camera.position.z;

  for (let i = 0; i < PED; i++) {
    const p = peds[i];
    let x, z, yaw, moveSpeed;

    if (p.kind === 'cross') {
      if (p.pause > 0) {
        p.pause -= dt;
      } else {
        p.ct += p.cdir * p.speed * dt / 24;
        if (p.ct >= 1) { p.ct = 1; p.cdir = -1; p.pause = 0.9 + Math.random(); }
        if (p.ct <= 0) { p.ct = 0; p.cdir = 1; p.pause = 0.9 + Math.random(); }
      }
      const across = -12 + p.ct * 24;
      if (p.axis === 'z') {
        x = p.lane + across; z = p.along;
        yaw = p.cdir > 0 ? Math.PI / 2 : -Math.PI / 2;
      } else {
        x = p.along; z = p.lane + across;
        yaw = p.cdir > 0 ? 0 : Math.PI;
      }
      moveSpeed = p.pause > 0 ? 0 : p.speed;
    } else {
      const rate = p.mode === 'run' ? 2.6 : 1;
      p.t += p.dir * p.speed * rate * dt;
      const q = pedPosAlongBlock(p);
      x = q.x; z = q.z;
      yaw = Math.atan2(q.ax * p.dir, q.az * p.dir);
      moveSpeed = p.mode === 'stand' ? 0 : p.speed * rate;
    }

    p.wx = x; p.wz = z;

    if (!force) {
      const dx = x - cxp, dz = z - czp;
      if (dx * dx + dz * dz > NEAR2) continue;
    }

    const rate2 = 4.2 + moveSpeed * 2.1;
    const amp = p.mode === 'stand' ? 0 : Math.min(1, 0.55 + moveSpeed * 0.25);
    const stride = Math.sin(time * rate2 + p.phase) * amp;
    const bob = p.mode === 'stand' ? 0 : Math.sin(time * rate2 * 2 + p.phase) * 0.018;

    // the odd hop, like someone jumping a puddle
    let jump = 0;
    if (p.hop && p.kind === 'block') {
      const cyc = (time * 0.35 + p.phase) % 1;
      if (cyc < 0.18) jump = Math.sin((cyc / 0.18) * Math.PI) * 0.42;
    }

    const lean = p.mode === 'run' ? 0.06 : 0;
    const baseY = jump + bob;

    placePart(pedTorso, i, x, z, yaw, 0, 1.04 + baseY, 0, lean, p.h);
    placePart(pedHead, i, x, z, yaw, 0, 1.5 + baseY, 0, lean * 0.6, p.h);
    placePart(pedHair, i, x, z, yaw, 0, 1.56 + baseY, -0.02, lean * 0.6, p.h);
    placePart(pedArmL, i, x, z, yaw, -0.29, 1.32 + baseY, 0, stride * 0.6, p.h);
    placePart(pedArmR, i, x, z, yaw, 0.29, 1.32 + baseY, 0, -stride * 0.6, p.h);
    placePart(pedLegL, i, x, z, yaw, -0.11, 0.78 + baseY, 0, -stride * 0.72, p.h);
    placePart(pedLegR, i, x, z, yaw, 0.11, 0.78 + baseY, 0, stride * 0.72, p.h);
  }

  for (const m of pedMeshes) m.instanceMatrix.needsUpdate = true;
}

const keys = { gas: false, brake: false, left: false, right: false, run: false, jump: false };

/* drag anywhere on the world to look around while walking or driving */
let lookYaw = 0, lookPitch = 0, dragging = false, lookX0 = 0, lookY0 = 0;
const viewCanvas = renderer.domElement;
viewCanvas.addEventListener('pointerdown', (e) => {
  dragging = true; lookX0 = e.clientX; lookY0 = e.clientY;
  try { if (viewCanvas.setPointerCapture) viewCanvas.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointer */ }
});
viewCanvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  lookYaw = Math.max(-2.4, Math.min(2.4, lookYaw - (e.clientX - lookX0) * 0.0062));
  lookPitch = Math.max(-0.4, Math.min(0.75, lookPitch + (e.clientY - lookY0) * 0.004));
  lookX0 = e.clientX; lookY0 = e.clientY;
});
const endDrag = () => { dragging = false; };
viewCanvas.addEventListener('pointerup', endDrag);
viewCanvas.addEventListener('pointercancel', endDrag);
viewCanvas.addEventListener('pointerleave', endDrag);

const stickEl = document.getElementById('stick');
const knobEl = document.getElementById('knob');
const stick = { x: 0, y: 0 };
let stickId = null;
let lastDriving = null;

function stickMove(e) {
  const r = stickEl.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const max = r.width * 0.33;
  let dx = e.clientX - cx, dy = e.clientY - cy;
  const len = Math.hypot(dx, dy) || 1;
  if (len > max) { dx = dx / len * max; dy = dy / len * max; }
  knobEl.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px)';
  stick.x = dx / max;
  stick.y = dy / max;
}
function stickEnd() {
  stickId = null; stick.x = 0; stick.y = 0;
  knobEl.style.transform = 'translate(0,0)';
}
stickEl.addEventListener('pointerdown', (e) => {
  stickId = e.pointerId;
  try { if (stickEl.setPointerCapture) stickEl.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointer */ }
  stickMove(e); e.preventDefault();
});
stickEl.addEventListener('pointermove', (e) => { if (stickId === e.pointerId) stickMove(e); });
stickEl.addEventListener('pointerup', stickEnd);
stickEl.addEventListener('pointercancel', stickEnd);
document.getElementById('carBtn').addEventListener('click', toggleVehicle);

function applyLook(cx, cz, fx, fz) {
  if (Math.abs(lookYaw) < 0.002 && Math.abs(lookPitch) < 0.002) return;
  const dx = camera.position.x - cx, dz = camera.position.z - cz;
  const c = Math.cos(lookYaw), sn = Math.sin(lookYaw);
  camera.position.x = cx + dx * c - dz * sn;
  camera.position.z = cz + dx * sn + dz * c;
  camera.position.y = Math.max(1.1, camera.position.y + lookPitch * 6);
  camera.lookAt(cx + fx * 7, 1.7 - lookPitch * 3.4, cz + fz * 7);
}
function setKey(name, down) { if (name in keys) keys[name] = down; }

function applyTimeOfDay(dt) {
  night += (nightTarget - night) * Math.min(1, dt * 1.5);
  if (Math.abs(nightTarget - night) < 0.003) night = nightTarget;
  const n = night;

  sun.intensity = 2.35 * (1 - n) + 0.05;
  sun.color.setHex(0xfff2d6).lerp(new THREE.Color(0x7d93c9), n);
  hemi.intensity = 1.0 * (1 - n) + 0.16;
  hemi.color.setHex(0xdcecff).lerp(new THREE.Color(0x2a3550), n);

  for (const m of buildingMats) m.emissiveIntensity = n * 1.55;
  headMesh.material.emissiveIntensity = n * 2.2;

  skyMat.uniforms.topColor.value.setHex(0x2f6bd8).lerp(new THREE.Color(0x040814), n).convertSRGBToLinear();
  skyMat.uniforms.midColor.value.setHex(0x8fc0ff).lerp(new THREE.Color(0x0a1526), n).convertSRGBToLinear();
  skyMat.uniforms.bottomColor.value.setHex(0xe6f0ff).lerp(new THREE.Color(0x18233c), n).convertSRGBToLinear();

  scene.fog.color.copy(dayFog).lerp(nightFog, n);
  scene.fog.near = 260 - n * 140;
  scene.fog.far = 1500 - n * 700;

  sunSprite.material.opacity = 1 - n;
  for (const c of clouds) c.material.opacity = (0.75 - n * 0.6);
  renderer.toneMappingExposure = 0.94 - n * 0.14;

  const hl = car.userData.headlights;
  if (hl) { hl[0].intensity = n * 80; hl[1].intensity = n * 80; }
}

/* -------------------------------- physics --------------------------------- */
const MAX_SPEED = 180 / 3.6;   // balanced street-car top speed
const CAM_FOV = camera.fov || 62;
const MAX_REVERSE = 14;
const ACCEL = 13;
const BRAKE = 34;
const CAR_R = 1.4;

function blocked(x, z, r) {
  const rad = r === undefined ? CAR_R : r;
  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i];
    if (x > b.minX - rad && x < b.maxX + rad && z > b.minZ - rad && z < b.maxZ + rad) return true;
  }
  return false;
}

let elapsed = 0;
let crash = 0;
let carAcceleration = 0;
let previousCarSpeed = 0;

function stepCar(dt) {
  elapsed += dt;
  const steerTarget = Math.max(-1, Math.min(1, (keys.left ? 1 : 0) - (keys.right ? 1 : 0) - stick.x));
  steerInput += (steerTarget - steerInput) * Math.min(1, dt * 8);

  const thr = Math.max(-1, Math.min(1, (keys.gas ? 1 : 0) - (keys.brake ? 1 : 0) - stick.y));
  if (thr > 0.02) speed += ACCEL * thr * dt;
  else if (thr < -0.02) speed += BRAKE * thr * dt;
  else speed *= Math.pow(0.35, dt);

  if (speed > MAX_SPEED) speed = MAX_SPEED;
  if (speed < -MAX_REVERSE) speed = -MAX_REVERSE;
  if (Math.abs(speed) < 0.06) speed = 0;

  const grip = Math.min(1, Math.abs(speed) / 7);
  const steerRate = 1.85 / (1 + Math.abs(speed) / 42);   // less twitchy at 500 km/h
  heading += steerInput * steerRate * grip * (speed < 0 ? -1 : 1) * dt;

  const fx = Math.sin(heading), fz = Math.cos(heading);
  const nx = car.position.x + fx * speed * dt;
  const nz = car.position.z + fz * speed * dt;

  if (!blocked(nx, nz)) { car.position.x = nx; car.position.z = nz; }
  else if (!blocked(nx, car.position.z)) { car.position.x = nx; speed *= 0.86; }
  else if (!blocked(car.position.x, nz)) { car.position.z = nz; speed *= 0.86; }
  else speed *= -0.18;

  const lim = 5400;
  car.position.x = THREE.MathUtils.clamp(car.position.x, -lim, lim);
  car.position.z = THREE.MathUtils.clamp(car.position.z, -lim, lim);

  // bump into other cars
  for (const t of traffic) {
    const dx = t.position.x - car.position.x, dz = t.position.z - car.position.z;
    if (dx * dx + dz * dz < 12.5) {
      car.position.x -= fx * Math.sign(speed) * 0.9;
      car.position.z -= fz * Math.sign(speed) * 0.9;
      speed *= -0.32;
      crash = 0.45;
      break;
    }
  }

  // Suspension/body response: acceleration pitches the body, cornering rolls it,
  // and each wheel spins at a rate derived from actual road speed.
  carAcceleration = dt > 0 ? (speed - previousCarSpeed) / dt : 0;
  previousCarSpeed = speed;
  const speedFactor = Math.min(1, Math.abs(speed) / 22);
  car.rotation.y = heading;
  car.rotation.z = THREE.MathUtils.damp(car.rotation.z, -steerInput * speedFactor * 0.055, 5, dt);
  car.rotation.x = THREE.MathUtils.damp(car.rotation.x, THREE.MathUtils.clamp(-carAcceleration * 0.0018, -0.045, 0.055), 5, dt);
  for (const part of car.userData.wheels || []) {
    if (part.front) part.pivot.rotation.y = steerInput * 0.34;
    part.wheel.rotation.x -= speed * dt / 0.46;
  }
  car.position.y = Math.sin(elapsed * 8) * 0.018 * speedFactor;
  if (crash > 0) {
    crash -= dt;
    const k = Math.max(0, crash) * 0.6;
    camera.position.y += (Math.random() - 0.5) * k;
    camera.position.x += (Math.random() - 0.5) * k;
  }

  sun.position.set(car.position.x + 130, 240, car.position.z + 100);
  sun.target.position.set(car.position.x, 0, car.position.z);
  sun.target.updateMatrixWorld();

  const fast = Math.min(1, Math.abs(speed) / MAX_SPEED);
  const back = 13.5 + fast * 6.5, up = 6.4 + fast * 1.8;
  const lerp = 1 - Math.exp(-dt * 5.5);
  camera.position.x += (car.position.x - fx * back - camera.position.x) * lerp;
  camera.position.z += (car.position.z - fz * back - camera.position.z) * lerp;
  camera.position.y += (up - camera.position.y) * lerp;
  const fovNow = CAM_FOV + fast * 18;
  if (Math.abs(camera.fov - fovNow) > 0.05) { camera.fov = fovNow; camera.updateProjectionMatrix(); }
  camera.lookAt(car.position.x + fx * 7, 1.7, car.position.z + fz * 7);

  applyLook(car.position.x, car.position.z, fx, fz);

  sun.target.position.set(car.position.x, 0, car.position.z);
  sun.position.set(car.position.x + 200, 320, car.position.z + 160);

}

function stepShared(dt) {
  for (const t of traffic) {
    const u = t.userData;
    u.pos += u.dir * u.speed * dt;
    const lim2 = HALF + 6;
    if (u.pos > lim2) u.pos = -lim2;
    if (u.pos < -lim2) u.pos = lim2;
    if (u.axis === 'x') {
      t.position.set(u.pos, 0, u.lane);
      t.rotation.y = u.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
    } else {
      t.position.set(u.lane, 0, u.pos);
      t.rotation.y = u.dir > 0 ? 0 : Math.PI;
    }
  }

  for (const c of clouds) {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > 1700) c.position.x = -1700;
  }

  updatePeds(dt, elapsed);

  document.querySelector('#speed b').textContent = mode === 'car' ? Math.round(Math.abs(speed) * 3.6) : Math.round(Math.abs(walkSpeed) * 3.6);
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

  if (!dragging) {
    const ease = Math.pow(0.28, dt);
    lookYaw *= ease; lookPitch *= ease;
    if (Math.abs(lookYaw) < 0.001) lookYaw = 0;
    if (Math.abs(lookPitch) < 0.001) lookPitch = 0;
  }

  if (hintTimer > 0) { hintTimer -= dt; if (hintTimer <= 0) hintEl.style.opacity = 0; }

  drawMini();
  if (mapOpen) {
    mapTick += dt;
    if (mapTick > 0.1) { mapTick = 0; drawWorldMap(); }
  }
}

function step(dt) {
  if (mode === 'walk') stepWalk(dt); else stepCar(dt);
  stepShared(dt);
  updateEngine();
}

}

/* ------------------------------ player on foot ----------------------------- */
function makePerson(shirt) {
  const g = new THREE.Group();
  const skin = new THREE.MeshStandardMaterial({ color: 0xd9b79a, roughness: 0.9 });
  const cloth = new THREE.MeshStandardMaterial({ color: shirt || 0x2f6bd8, roughness: 0.85 });
  const pants = new THREE.MeshStandardMaterial({ color: 0x2b3038, roughness: 0.92 });

  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 0.52, 4, 10), cloth);
  torso.position.y = 1.1; torso.castShadow = true; g.add(torso);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 14, 12), skin);
  head.position.y = 1.6; head.castShadow = true; g.add(head);

  const hairMat = new THREE.MeshStandardMaterial({ color: 0x1c1511, roughness: 0.95 });
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.225, 14, 10, 0, Math.PI * 2, 0, Math.PI * 0.62), hairMat);
  hair.position.y = 1.62; hair.castShadow = true; g.add(hair);

  // shoulders so the torso is not a bare capsule
  const shoulders = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.16, 0.26), cloth);
  shoulders.position.y = 1.34; shoulders.castShadow = true; g.add(shoulders);

  const shoeMat = new THREE.MeshStandardMaterial({ color: 0x14140f, roughness: 0.8 });
  const shoeGeo = new THREE.BoxGeometry(0.18, 0.1, 0.28);

  const legGeo = new THREE.BoxGeometry(0.17, 0.8, 0.2).translate(0, -0.4, 0);
  const legL = new THREE.Mesh(legGeo, pants);
  legL.position.set(-0.11, 0.8, 0); legL.castShadow = true; g.add(legL);
  const legR = new THREE.Mesh(legGeo, pants);
  legR.position.set(0.11, 0.8, 0); legR.castShadow = true; g.add(legR);

  const shoeL = new THREE.Mesh(shoeGeo, shoeMat);
  shoeL.position.set(-0.11, 0.05, 0.03); shoeL.castShadow = true; g.add(shoeL);
  const shoeR = new THREE.Mesh(shoeGeo, shoeMat);
  shoeR.position.set(0.11, 0.05, 0.03); shoeR.castShadow = true; g.add(shoeR);

  const armGeo = new THREE.BoxGeometry(0.1, 0.54, 0.13).translate(0, -0.25, 0);
  const armL = new THREE.Mesh(armGeo, cloth);
  armL.position.set(-0.29, 1.32, 0); armL.castShadow = true; g.add(armL);
  const armR = new THREE.Mesh(armGeo, cloth);
  armR.position.set(0.29, 1.32, 0); armR.castShadow = true; g.add(armR);

  g.userData = { legL, legR, armL, armR, head, hair, shoeL, shoeR, torso, shoulders };
  return g;
}

const player = makePerson(0x2f6bd8);

let mode = 'car';
const walkPos = new THREE.Vector3(START.x, 0, START.z);
let walkHeading = 0, walkSpeed = 0;
let jumpY = 0, jumpV = 0, onGround = true;
let sprinting = false;
let gaitPhase = 0;
let walkSpeedSmooth = 0;

const exitBtn = document.getElementById('exitBtn');
function toggleVehicle() {
  if (mode === 'car') {
    if (Math.abs(speed) > 5) return;
    const px = Math.cos(heading), pz = -Math.sin(heading);
    walkPos.set(car.position.x + px * 2.1, 0, car.position.z + pz * 2.1);
    walkHeading = heading;
    walkSpeed = 0;
    speed = 0;
    mode = 'walk';
    player.visible = true;
    exitBtn.textContent = '🚗';
    showHint('E ឡើងឡានវិញ');
  } else {
    if (Math.hypot(walkPos.x - car.position.x, walkPos.z - car.position.z) > 7) {
      showHint('ដើរទៅជិតឡានសិន');
      return;
    }
    player.visible = false;
    mode = 'car';
    exitBtn.textContent = '🚶';
    showHint('E ចុះពីឡាន');
  }
}
exitBtn.addEventListener('click', (e) => { e.preventDefault(); toggleVehicle(); });

const hintEl = document.getElementById('hint');
let hintTimer = 0;
function showHint(text) {
  if (hintEl) { hintEl.textContent = text; hintEl.style.opacity = 1; hintTimer = 2.6; }
}

function stepWalk(dt) {
  const turn = Math.max(-1, Math.min(1, (keys.left ? 1 : 0) - (keys.right ? 1 : 0) - stick.x));
  walkHeading += turn * 2.2 * dt;
  const thrust = Math.max(-1, Math.min(1, (keys.gas ? 1 : 0) - (keys.brake ? 1 : 0) - stick.y));
  const topSpeed = keys.run ? 9.2 : 4.4;         // Shift / 🏃 runs
  walkSpeed += (thrust * topSpeed - walkSpeed) * Math.min(1, dt * (keys.run ? 6 : 7));
  if (Math.abs(walkSpeed) < 0.03) walkSpeed = 0;

  const fx = Math.sin(walkHeading), fz = Math.cos(walkHeading);
  const nx = walkPos.x + fx * walkSpeed * dt;
  const nz = walkPos.z + fz * walkSpeed * dt;
  const rad = 0.5;
  if (!blocked(nx, nz, rad)) { walkPos.x = nx; walkPos.z = nz; }
  else if (!blocked(nx, walkPos.z, rad)) walkPos.x = nx;
  else if (!blocked(walkPos.x, nz, rad)) walkPos.z = nz;

  const lim = 5400;
  walkPos.x = THREE.MathUtils.clamp(walkPos.x, -lim, lim);
  walkPos.z = THREE.MathUtils.clamp(walkPos.z, -lim, lim);

  // jump: Space / ⤒ — real gravity so it lands like a person
  if (keys.jump && onGround) { jumpV = 5.6; onGround = false; keys.jump = false; }
  if (!onGround) {
    jumpV -= 17 * dt;
    jumpY += jumpV * dt;
    if (jumpY <= 0) { jumpY = 0; jumpV = 0; onGround = true; }
  }

  player.position.set(walkPos.x, jumpY, walkPos.z);
  player.rotation.y = walkHeading;

  // Speed-driven gait cycle: footfalls, opposing arm swing, subtle torso bob
  // and body lean are blended smoothly instead of switching abruptly.
  const targetWalkSpeed = Math.abs(walkSpeed);
  walkSpeedSmooth += (targetWalkSpeed - walkSpeedSmooth) * (1 - Math.exp(-dt * 8));
  const gaitRate = 5.2 + walkSpeedSmooth * 2.35;
  if (walkSpeedSmooth > 0.12) gaitPhase += gaitRate * dt;
  const moveBlend = THREE.MathUtils.smoothstep(walkSpeedSmooth, 0.08, 1.0);
  const stride = Math.sin(gaitPhase);
  const stride2 = Math.sin(gaitPhase * 2);
  const runBlend = THREE.MathUtils.smoothstep(walkSpeedSmooth, 4.2, 7.0);
  const strideAmp = THREE.MathUtils.lerp(0.52, 0.88, runBlend) * moveBlend;
  const legSwing = stride * strideAmp;
  const armSwing = -legSwing * 0.72;
  player.userData.legL.rotation.x = onGround ? legSwing : -0.58;
  player.userData.legR.rotation.x = onGround ? -legSwing : 0.34;
  player.userData.armL.rotation.x = onGround ? armSwing : -0.22;
  player.userData.armR.rotation.x = onGround ? -armSwing : 0.32;
  player.userData.shoeL.rotation.x = player.userData.legL.rotation.x * 0.55;
  player.userData.shoeR.rotation.x = player.userData.legR.rotation.x * 0.55;
  const bodyBob = onGround ? Math.abs(stride2) * 0.035 * moveBlend : 0;
  player.userData.torso.position.y = 1.1 + bodyBob;
  player.userData.head.position.y = 1.6 + bodyBob * 0.8;
  player.userData.shoulders.position.y = 1.34 + bodyBob;
  player.rotation.x = THREE.MathUtils.damp(player.rotation.x, -Math.min(0.12, walkSpeedSmooth * 0.012), 7, dt);
  player.rotation.z = THREE.MathUtils.damp(player.rotation.z, -turn * 0.055, 7, dt);
  if (player.userData.head) {
    player.userData.head.rotation.y = -lookYaw * 0.5;
    if (player.userData.hair) player.userData.hair.rotation.y = -lookYaw * 0.5;
  }

  const back = 5.6, up = 2.85;
  const k = 1 - Math.exp(-dt * 6);
  const rx = Math.cos(walkHeading) * 1.1, rz = -Math.sin(walkHeading) * 1.1;
  camera.position.x += (walkPos.x - fx * back + rx - camera.position.x) * k;
  camera.position.z += (walkPos.z - fz * back + rz - camera.position.z) * k;
  camera.position.y += (up + jumpY * 0.6 - camera.position.y) * k;
  camera.lookAt(walkPos.x + fx * 6 + rx, 1.55 + jumpY * 0.7, walkPos.z + fz * 6 + rz);

  applyLook(walkPos.x, walkPos.z, fx, fz);

  sun.position.set(walkPos.x + 130, 240, walkPos.z + 100);
  sun.target.position.set(walkPos.x, 0, walkPos.z);
  sun.target.updateMatrixWorld();

  if (hintTimer > 0) { hintTimer -= dt; if (hintTimer <= 0) hintEl.style.opacity = 0; }
}

/* --------------------------------- radio ---------------------------------- */
let actx = null, engineGain = null, engineFilter = null, oscA = null, oscB = null;
let noiseGain = null, engineOn = true;

function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();

  engineGain = actx.createGain();
  engineGain.gain.value = 0;
  engineFilter = actx.createBiquadFilter();
  engineFilter.type = 'lowpass';
  engineFilter.frequency.value = 700;
  engineGain.connect(engineFilter);
  engineFilter.connect(actx.destination);

  oscA = actx.createOscillator();
  oscA.type = 'sawtooth';
  oscA.frequency.value = 42;
  const gA = actx.createGain(); gA.gain.value = 0.5;
  oscA.connect(gA); gA.connect(engineGain);

  oscB = actx.createOscillator();
  oscB.type = 'square';
  oscB.frequency.value = 21;
  const gB = actx.createGain(); gB.gain.value = 0.3;
  oscB.connect(gB); gB.connect(engineGain);

  oscA.start();
  oscB.start();

  const len = Math.floor(actx.sampleRate * 2);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const noise = actx.createBufferSource();
  noise.buffer = buf;
  noise.loop = true;
  const nf = actx.createBiquadFilter();
  nf.type = 'bandpass';
  nf.frequency.value = 900;
  nf.Q.value = 0.8;
  noiseGain = actx.createGain();
  noiseGain.gain.value = 0;
  noise.connect(nf); nf.connect(noiseGain); noiseGain.connect(actx.destination);
  noise.start();
}

function updateEngine() {
  if (!actx || !engineGain) return;
  const sp = Math.abs(speed);
  const driving = mode === 'car' && engineOn;
  const rpm = 40 + sp * 5.6 + (keys.gas ? 9 : 0);
  const now = actx.currentTime;
  oscA.frequency.setTargetAtTime(Math.max(26, rpm), now, 0.07);
  oscB.frequency.setTargetAtTime(Math.max(13, rpm * 0.5), now, 0.07);
  engineFilter.frequency.setTargetAtTime(420 + sp * 95 + (keys.gas ? 220 : 0), now, 0.12);
  const vol = driving ? 0.16 + 0.42 * Math.min(1, sp / 22) + (keys.gas ? 0.06 : 0) : 0;
  engineGain.gain.setTargetAtTime(vol, now, 0.1);
  noiseGain.gain.setTargetAtTime(driving ? Math.min(0.09, sp * 0.005) : 0, now, 0.2);
}

/* Voronoi cells: half-plane clipping of a box around every capital */
function clipHalfPlane(poly, nx, ny, c) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    const da = nx * a[0] + ny * a[1] - c;
    const db = nx * b[0] + ny * b[1] - c;
    if (da <= 0) out.push(a);
    if ((da < 0 && db > 0) || (da > 0 && db < 0)) {
      const t = da / (da - db);
      out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
    }
  }
  return out;
}
const provCells = PROVINCES.map((site, i) => {
  let poly = [[LON0 - 2, LAT0 - 2], [LON1 + 2, LAT0 - 2], [LON1 + 2, LAT1 + 2], [LON0 - 2, LAT1 + 2]];
  for (let j = 0; j < PROVINCES.length; j++) {
    if (i === j) continue;
    const nx = PROVINCES[j][1] - site[1], ny = PROVINCES[j][2] - site[2];
    const mx = (PROVINCES[j][1] + site[1]) / 2, my = (PROVINCES[j][2] + site[2]) / 2;
    poly = clipHalfPlane(poly, nx, ny, nx * mx + ny * my);
    if (poly.length < 3) break;
  }
  let cx = 0, cy = 0;
  for (const q of poly) { cx += q[0]; cy += q[1]; }
  return { poly, cx: cx / poly.length, cy: cy / poly.length };
});

  if (mapZoom < 1.2) { mapLon = (LON0 + LON1) / 2; mapLat = (LAT0 + LAT1) / 2; }
  mapLon = Math.max(LON0 + 0.25, Math.min(LON1 - 0.25, mapLon));
  mapLat = Math.max(LAT0 + 0.2, Math.min(LAT1 - 0.2, mapLat));

  const base = Math.min(w / (LON1 - LON0), h / (LAT1 - LAT0));
  mapSc = base * mapZoom;
  const X = (lon) => w / 2 + (lon - mapLon) * mapSc;

  const sea = g.createLinearGradient(0, 0, 0, h);

  const countryPath = () => {
    g.beginPath();
    KHM.forEach(([lon, lat], i) => { if (i) g.lineTo(X(lon), Y(lat)); else g.moveTo(X(lon), Y(lat)); });
    g.closePath();
  };

  /* soft shadow under the country */

  g.shadowBlur = 18;
  countryPath();
  g.fillStyle = '#2c5a3d';
  g.fill();
  g.restore();

  /* land, then every province inside it */
  g.save();
  countryPath();
  g.fillStyle = '#2c5a3d';

  provCells.forEach((cell, i) => {
    if (cell.poly.length < 3) return;

/* drag to pan, pinch or wheel to zoom, buttons for the rest */
const mapPtrs = new Map();
let mapPinch0 = 0, mapZoom0 = 1;
worldMap.addEventListener('pointerdown', (e) => {
  mapPtrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { if (worldMap.setPointerCapture) worldMap.setPointerCapture(e.pointerId); } catch (err) { /* synthetic */ }
  if (mapPtrs.size === 2) {
    const [a, b] = [...mapPtrs.values()];
    mapPinch0 = Math.hypot(a.x - b.x, a.y - b.y);
    mapZoom0 = mapZoom;
  }
});
worldMap.addEventListener('pointermove', (e) => {
  const p = mapPtrs.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (mapPtrs.size === 1) {
    mapLon -= dx / mapSc;
    mapLat += dy / mapSc;
    drawWorldMap();
  } else if (mapPtrs.size === 2 && mapPinch0 > 0) {
    const [a, b] = [...mapPtrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    mapZoom = clampZoom(mapZoom0 * (d / mapPinch0));
    drawWorldMap();
  }
});
const mapRelease = (e) => {
  mapPtrs.delete(e.pointerId);
  if (mapPtrs.size < 2) mapPinch0 = 0;
};
worldMap.addEventListener('pointerup', mapRelease);
worldMap.addEventListener('pointercancel', mapRelease);
worldMap.addEventListener('wheel', (e) => {
  e.preventDefault();
  mapZoom = clampZoom(mapZoom * Math.exp(-e.deltaY * 0.0016));
  drawWorldMap();
}, { passive: false });

document.getElementById('mapOut').addEventListener('click', () => { mapZoom = clampZoom(mapZoom / 1.6); drawWorldMap(); });
document.getElementById('mapHome').addEventListener('click', () => {

/* GTA-style radar: round, heading-up, with the player arrow fixed in the middle */
const mini = document.getElementById('mini');
const mctx = mini.getContext('2d');
const MINI = 148;
const MINI_SPAN = 260;                     // metres visible across the radar
const MAPM = (HALF + SPACING) * 2;         // the whole city in metres
const cityMap = document.createElement('canvas');
cityMap.width = cityMap.height = 1024;

(function paintCity() {
  const g = cityMap.getContext('2d');
  const k = 1024 / MAPM;
  const off = HALF + SPACING;
  g.fillStyle = '#1d232b';                       // asphalt
  g.fillRect(0, 0, 1024, 1024);
  g.fillStyle = '#5b646f';                       // pavements + blocks
  for (const b of blocks) {
    g.fillRect((b.minX + off) * k, (b.minZ + off) * k, (b.maxX - b.minX) * k, (b.maxZ - b.minZ) * k);
  }
  g.fillStyle = '#2f6b3a';                       // parks
  for (const p of parks) {
    g.fillRect((p.cx - BLOCK / 2 + off) * k, (p.cz - BLOCK / 2 + off) * k, BLOCK * k, BLOCK * k);
  }
})();

function drawMini() {
  const R = MINI / 2;
  const px = mode === 'car' ? car.position.x : walkPos.x;
  const pz = mode === 'car' ? car.position.z : walkPos.z;
  const h = mode === 'car' ? heading : walkHeading;
  const off = HALF + SPACING;

  mctx.clearRect(0, 0, MINI, MINI);
  mctx.save();
  mctx.beginPath();
  mctx.arc(R, R, R - 1, 0, Math.PI * 2);
  mctx.clip();
  mctx.fillStyle = '#1d232b';
  mctx.fillRect(0, 0, MINI, MINI);

  const k2 = MINI / MINI_SPAN;
  mctx.translate(R, R);
  mctx.rotate(h + Math.PI);          // the way you face is always up
  mctx.scale(k2, k2);
  mctx.translate(-px, -pz);
  mctx.drawImage(cityMap, -off, -off, MAPM, MAPM);

  // people
  mctx.fillStyle = 'rgba(235,240,250,0.7)';
  for (let i = 0; i < peds.length; i += 12) {
    const q = peds[i];
    if (q.wx === undefined) continue;
    if (Math.abs(q.wx - px) > 160 || Math.abs(q.wz - pz) > 160) continue;
    mctx.fillRect(q.wx - 1.6, q.wz - 1.6, 3.2, 3.2);
  }
  // cars
  mctx.fillStyle = '#ffd166';
  for (const t of traffic) {
    if (Math.abs(t.position.x - px) > 160 || Math.abs(t.position.z - pz) > 160) continue;
    mctx.fillRect(t.position.x - 2.6, t.position.z - 2.6, 5.2, 5.2);
  }
  mctx.restore();

  // the arrow never turns: the map does
  mctx.save();
  mctx.translate(R, R);
  mctx.beginPath();
  mctx.moveTo(0, -13); mctx.lineTo(8, 11); mctx.lineTo(0, 6); mctx.lineTo(-8, 11);
  mctx.closePath();
  mctx.fillStyle = '#ffffff';
  mctx.strokeStyle = 'rgba(20,30,45,0.8)';
  mctx.lineWidth = 1.6;
  mctx.fill(); mctx.stroke();
  mctx.restore();

  // ring + north marker
  mctx.beginPath();
  mctx.arc(R, R, R - 1.5, 0, Math.PI * 2);
  mctx.strokeStyle = 'rgba(255,255,255,0.32)';
  mctx.lineWidth = 3;
  mctx.stroke();

  const na = -h;
  mctx.fillStyle = 'rgba(255,255,255,0.85)';
  mctx.font = '700 11px system-ui, sans-serif';
  mctx.fillText('N', R + Math.sin(na) * (R - 13) - 4, R - Math.cos(na) * (R - 13) + 4);
}

/* instanced meshes get their matrices written after creation, so their bounding
   sphere no longer matches where the instances are: keep them out of culling */
scene.traverse((o) => { if (o.isInstancedMesh) o.frustumCulled = false; });

window.__cd = {
  get state() {
    return {
      mode, running, speed: +speed.toFixed(1), walkSpeed: +walkSpeed.toFixed(1),
      camY: +camera.position.y.toFixed(2),
      camXZ: [+camera.position.x.toFixed(1), +camera.position.z.toFixed(1)],
      walk: [+walkPos.x.toFixed(1), +walkPos.z.toFixed(1)],
      car: [+car.position.x.toFixed(1), +car.position.z.toFixed(1)],
      playerVisible: player.visible, nights: night,
      jumpY: +jumpY.toFixed(2), onGround, running: keys.run
    };
  },
  get map() { return { zoom: +mapZoom.toFixed(2), lon: +mapLon.toFixed(3), lat: +mapLat.toFixed(3) }; },
  ped(i) {
    const q = peds[i];
    return { x: +q.wx.toFixed(1), z: +q.wz.toFixed(1) };
  },
  get pedCount() { return peds.length; },
  tp(x, z, h) {
    car.position.x = x; car.position.z = z;
    walkPos.set(x, 0, z);
    if (typeof h === 'number') heading = h;
    speed = 0;
    camera.position.set(x - Math.sin(heading) * 14, 7.5, z - Math.cos(heading) * 14);
  },
  get scene() { return scene; },
  get camera() { return camera; },
  get three() { return THREE; },
  shot() {
    composer.render();
    fetch('/api/shot', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: 'operator', data: renderer.domElement.toDataURL('image/jpeg', 0.72) })
    });
  }
};

/* ---- live view bridge: lets the operator watch this session (http only) ---- */
if (location.protocol.startsWith('http') && window.fetch) {
  const sid = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-6);
  const post = (u, b) => fetch(u, {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b)
  }).catch(() => {});

  setInterval(() => {
    post('/api/hb', {
      id: sid, running, fps: liveFps, hd, night,
      x: +car.position.x.toFixed(1), z: +car.position.z.toFixed(1),
      speed: Math.round(Math.abs(speed) * 3.6), heading: +heading.toFixed(2),
      size: [window.innerWidth, window.innerHeight], mode,
      engineOn,
      paint: '#' + car.children[0].material.color.getHexString()
    });
  }, 1000);

  setInterval(() => {
    fetch('/api/cmd?id=' + sid, { cache: 'no-store' })
      .then((r) => r.json())
      .then((j) => { for (const c of (j.cmds || [])) runCmd(c); })
      .catch(() => {});
  }, 1200);

  function runCmd(c) {
    if (!c || typeof c !== 'object') return;
    if (c.t === 'shot') {
      renderer.render(scene, camera);
      post('/api/shot', { id: sid, data: renderer.domElement.toDataURL('image/jpeg', 0.72) });
    } else if (c.t === 'tp') {
      car.position.x = Number(c.x) || 0;
      car.position.z = Number(c.z) || 0;
      if (typeof c.h === 'number') heading = c.h;
      speed = 0;
      camera.position.set(
        car.position.x - Math.sin(heading) * 14, 7.5,
        car.position.z - Math.cos(heading) * 14
      );
    } else if (c.t === 'hd') {
      if (!!c.on !== hd) document.getElementById('qBtn').click();
    } else if (c.t === 'night') {
      nightTarget = night = Math.max(0, Math.min(1, Number(c.v) || 0));
      applyTimeOfDay(1);
    } else if (c.t === 'mode') {
      const want = c.v === 'walk' ? 'walk' : 'car';
      if (want === 'walk' && mode === 'car') {
        walkPos.set(car.position.x + 2.1, 0, car.position.z);
        walkHeading = heading; walkSpeed = 0; speed = 0;
        player.visible = true; mode = 'walk';
        document.getElementById('exitBtn').textContent = '🚗';
      } else if (want === 'car' && mode === 'walk') {
        player.visible = false; mode = 'car';
        document.getElementById('exitBtn').textContent = '🚶';
      }
    } else if (c.t === 'keys') {
      for (const k of ['gas', 'brake', 'left', 'right']) {
        if (typeof c[k] === 'boolean') keys[k] = c[k];
      }
    } else if (c.t === 'release') {
      keys.gas = keys.brake = keys.left = keys.right = false;
    } else if (c.t === 'pause') {
      running = false;
    } else if (c.t === 'resume') {
      running = true;
    }
  }
}

composer.render();
frame();

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
